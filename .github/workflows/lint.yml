name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install linters
        run: |
          npm install -g htmlhint eslint stylelint

      - name: Lint HTML
        run: htmlhint "*.html"

      - name: Lint JavaScript
        run: eslint "js/**/*.js"

      - name: Lint CSS
        run: stylelint "css/**/*.css"
    
